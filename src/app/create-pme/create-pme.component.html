<section class="wrapper">
  <h3><i class="fa fa-angle-right"></i> Form Validation</h3>
  <!-- BASIC FORM VALIDATION -->
  <div class="row mt">
    <div class="col-lg-12">
      <h4><i class="fa fa-angle-right"></i> Basic Validations</h4>
      <div class="form-panel">
        <form role="form" (ngSubmit)="onSubmit()" class="form-horizontal style-form">
          <div class="form-group has-success">
            <div class="col-lg-10">
              <input type="text" id="Nom" class="form-control" placeholder="Nom" [(ngModel)]="pme.Nom" name="Nom" required>
              <p class="help-block"></p>
            </div>
          </div>
          <div class="form-group has-error">
            <div class="col-lg-10">
              <input type="email" id="Email" class="form-control" placeholder="Email" [(ngModel)]="pme.Email" name="Email" required>
              <p class="help-block"></p>
            </div>
          </div>
          <div class="form-group ">
            <label for="Tel" class="control-label col-lg-2"></label>
            <div class="col-lg-10">
              <input type="Tel" id="Tel" class="form-control" placeholder="Numéro de téléphone" [(ngModel)]="pme.Tel" name="Tel" required>
            </div>
          </div>
          <div class="form-group ">
            <label for="password" class="control-label col-lg-2"></label>
            <div class="col-lg-10">
              <input type="password" id="Password" class="form-control" placeholder="Mot de passe" [(ngModel)]="pme.Password" name="Password" required>
            </div>
          </div>
          <div class="form-group ">
            <label for="confirm_password" class="control-label col-lg-2"></label>
            <div class="col-lg-10">
              <input class="form-control " id="confirm_password" placeholder="Confirmez votre mot de passe" name="confirm_password" type="password">
            </div>
          </div>
          <div class="form-group">
            <div class="col-lg-offset-2 col-lg-10">
              <button class="btn btn-theme" type="submit">Submit</button>
            </div>
          </div>
        </form>
      </div>
      <!-- /form-panel -->
    </div>
    <!-- /col-lg-12 -->
  </div>
  <!-- /row -->
  <!-- FORM VALIDATION -->
  <div class="row mt">
    <div class="col-lg-12">
      <h4><i class="fa fa-angle-right"></i> Form Validations</h4>
      <div class="form-panel">
        <div class=" form">
          <form class="cmxform form-horizontal style-form" id="commentForm" method="get" action="">
            <div class="form-group ">
              <label for="cname" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input type="text" id="Localisation" class="form-control" placeholder="Localisation" [(ngModel)]="pme.Localisation" name="Localisation" required>
              </div>
            </div>
            <div class="form-group ">
              <label for="Departement" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input class="form-control " id="Departement" type="Departement" placeholder="Département" name="Departement" required="">
              </div>
            </div>
            <div class="form-group ">
              <label for="Region" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input class="form-control " id="Region" type="Region" placeholder="Région" name="Region" required="">
              </div>
            </div>
            <div class="form-group ">
              <label for="Pays" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input class="form-control " id="Pays" type="Pays" name="Pays" placeholder="Pays" required="">
              </div>
            </div>
            <div class="form-group ">
              <label for="curl" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input type="text" id="SiteWeb" class="form-control" placeholder="URL (optional)" [(ngModel)]="pme.SiteWeb" name="SiteWeb" required>
              </div>
            </div>
            <div class="form-group ">
              <label for="curl" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input type="text" id="Logo" class="form-control" placeholder="Logo de votre entreprise" [(ngModel)]="pme.Logo" name="Logo" required>
              </div>
            </div>
            <div class="form-group ">
              <label for="ccomment" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <textarea class="form-control " id="ccomment" name="comment" placeholder="Description (Pas nécessaire)" required=""></textarea>
              </div>
            </div>
            <div class="form-group">
              <div class="col-lg-offset-2 col-lg-10">
                <button class="btn btn-theme" type="submit">Save</button>
                <button class="btn btn-theme04" type="button">Cancel</button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- /form-panel -->
    </div>
    <!-- /col-lg-12 -->
  </div>
  <!-- /row -->
  <div class="row mt">
    <div class="col-lg-12">
      <h4><i class="fa fa-angle-right"></i> Advanced Form Validations</h4>
      <div class="form-panel">
        <div class="form">
          <form class="cmxform form-horizontal style-form" id="signupForm" method="get" action="">
            <div class="form-group ">
              <label for="firstname" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input class=" form-control" id="Effectif" name="Effectif" placeholder="Effectif" type="number">
              </div>
            </div>
            <div class="form-group ">
              <label for="lastname" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input class=" form-control" id="lastname" name="lastname" type="text">
              </div>
            </div>
            <div class="form-group ">
              <label for="username" class="control-label col-lg-2"></label>
              <div class="col-lg-10">
                <input class="form-control " id="username" name="username" type="text">
              </div>
            </div>
            
          <div class="form-group has-warning">
            <div class="col-lg-10">
              <input type="text" id="Statut_juridique" placeholder="Statut juridique de votre entrprise" class="form-control" [(ngModel)]="pme.Statut_juridique" name="Statut_juridique">
              <p class="help-block"></p>
            </div>
          </div>
            <div class="form-group ">
              <label for="email" class="control-label col-lg-2">Email</label>
              <div class="col-lg-10">
                <input class="form-control " id="email" name="email" type="email">
              </div>
            </div>
            <div class="form-group ">
              <label for="agree" class="control-label col-lg-2 col-sm-3">Agree to Our Policy</label>
              <div class="col-lg-10 col-sm-9">
                <input type="checkbox" style="width: 20px" class="checkbox form-control" id="agree" name="agree">
              </div>
            </div>
            <div class="form-group ">
              <label for="newsletter" class="control-label col-lg-2 col-sm-3">Receive the Newsletter</label>
              <div class="col-lg-10 col-sm-9">
                <input type="checkbox" style="width: 20px" class="checkbox form-control" id="newsletter" name="newsletter">
              </div>
            </div>
            <div class="form-group">
              <div class="col-lg-offset-2 col-lg-10">
                <button class="btn btn-theme" type="submit">Save</button>
                <button class="btn btn-theme04" type="button">Cancel</button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- /form-panel -->
    </div>
    <!-- /col-lg-12 -->
  </div>
  <!-- /row -->
</section>
