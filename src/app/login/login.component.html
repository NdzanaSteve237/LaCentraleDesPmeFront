<div class="login-container">
    <div id="login-page">
        <body>
            <div class="container">
          <form class="form-login" (ngSubmit)="onLogin()">
            <h2 class="form-login-heading">sign in now</h2>
            <div class="login-wrap">

              <input type="email" id="email" class="form-control" [(ngModel)]="email" placeholder="Email" name="email" required>
              <br>
              <input type="password" id="password" class="form-control" placeholder="Mot de passe" [(ngModel)]="password" name="password" required>


              <label class="checkbox">
                <input type="checkbox" value="remember-me"> Remember me
                <span class="pull-right">
                <a data-toggle="modal" href="login.html#myModal"> Forgot Password?</a>
                </span>
                </label>
              <button class="btn btn-theme btn-block" href="index.html" type="submit"><i class="fa fa-lock"></i> SIGN IN</button>
              <hr>
              <div class="registration">
                Don't have an account yet?<br/>
                <a class="" href="#">
                  Create an account
                  </a>
              </div>
            </div>
            <!-- Modal -->
            <div aria-hidden="true" aria-labelledby="myModalLabel" role="dialog" tabindex="-1" id="myModal" class="modal fade">
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title">Forgot Password ?</h4>
                  </div>
                  <div class="modal-body">
                    <p>Enter your e-mail address below to reset your password.</p>
                    <input type="text" name="email" placeholder="Email" autocomplete="off" class="form-control placeholder-no-fix">
                  </div>
                  <div class="modal-footer">
                    <button data-dismiss="modal" class="btn btn-default" type="button">Cancel</button>
                    <button class="btn btn-theme" type="button">Submit</button>
                  </div>
                </div>
              </div>
            </div>
            <!-- modal -->
          </form>
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">
            {{ errorMessage }}
          </div>
        </div>
        <script>
            $.backstretch("../../assets/img/cover.jpeg", {
              speed: 500
            });
          </script>
        </body>
        
    </div>
</div>
